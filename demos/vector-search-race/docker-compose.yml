services:
  elasticsearch-sink:
    image: docker.elastic.co/elasticsearch/elasticsearch:${SINK_VERSION}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - jingra-demo-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
    networks:
      - jingra-demo-net

  opensearch:
    image: opensearchproject/opensearch:${OS_VERSION}
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
    networks:
      - jingra-demo-net

  qdrant:
    build:
      context: ${COMMON_DIR}
      dockerfile: Dockerfile.qdrant
      args:
        QD_VERSION: ${QD_VERSION}
    image: jingra-demo-qdrant:v${QD_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
    networks:
      - jingra-demo-net

  jingra:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: demos/common/Dockerfile
    volumes:
      - ${DATA_PATH:-./data}:/app/data:ro
      - ${CONFIG_FILE:-./elasticsearch/config.yaml}:/app/config.yaml:ro
      - ${CONFIG_DIR:-./elasticsearch/config}:/app/jingra-config:ro
      - ${OUTPUT_DIR:-./elasticsearch/output}:/app/output
    environment:
      - SINK_URL=http://elasticsearch-sink:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OPENSEARCH_URL=http://opensearch:9200
      - QDRANT_URL=http://qdrant:6334
    depends_on:
      elasticsearch-sink:
        condition: service_healthy
    networks:
      - jingra-demo-net

networks:
  jingra-demo-net:
    driver: bridge
