engine: qdrant

qdrant:
  url_env: QDRANT_URL
  vector_field: embedding

dataset: vector

datasets:
  vector:
    type: vector
    index_name: vector
    schema_name: vector-schema
    query_name: vector-query

    path:
      data_path: data/docs.ndjson
      queries_path: data/queries.ndjson

    data_mapping:
      id_field: id

    queries_mapping:
      query_vector_field: embedding
      ground_truth_field: ground_truth

    param_groups:
      recall@10:
        - { size: 10, hnsw_ef: 10, oversampling: 1 }
        - { size: 10, hnsw_ef: 20, oversampling: 1 }
        - { size: 10, hnsw_ef: 40, oversampling: 1 }
        - { size: 10, hnsw_ef: 80, oversampling: 1 }
        - { size: 10, hnsw_ef: 160, oversampling: 1 }
        - { size: 10, hnsw_ef: 320, oversampling: 1 }

load:
  threads: 4
  batch_size: 100
  queue_capacity: 100

evaluation:
  run_id: vector-search-race
  warmup_workers: 1
  measurement_workers: 1
  warmup_rounds: 5
  measurement_rounds: 100

output:
  sinks:
    - type: elasticsearch
      config:
        url_env: SINK_URL
        index: jingra-results
