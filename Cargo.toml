[package]
name = "jingra"
version = "0.3.0"
edition = "2024"
description = "Benchmarking framework for vector search engines, starting with Qdrant"
license = "Apache-2.0"
repository = "https://github.com/sachinfrayne/jingra"
# Distributed as source from GitHub, not published to crates.io.
publish = false

[lib]
name = "jingra"
path = "src/lib.rs"

[[bin]]
name = "jingra"
path = "src/main.rs"

[profile.release]
# "thin" LTO instead of fat LTO ("true"): fat LTO across this many heavy dependencies
# (arrow/parquet/tonic/qdrant-client) OOM-killed the linker step in a 2GB-memory container
# build during testing. A batch CLI tool doesn't need fat LTO's marginal runtime gain badly
# enough to justify that build fragility on memory-constrained hosts.
lto = "thin"

[dependencies]
anyhow = "1.0.104"
arrow = "59.2.0"
async-trait = "0.1.92"
bytes = "1.12.1"
percent-encoding = "2.3"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
futures = "0.3.34"
object_store = { version = "0.14.1", features = ["aws", "gcp", "azure"] }
parquet = { version = "59.2.0", features = ["async"] }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "area_series", "line_series"] }
qdrant-client = { version = "1.19.0", features = ["uuid"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.24.1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
mockall = "0.15.0"
tempfile = "3.27.0"
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["test-util"] }
